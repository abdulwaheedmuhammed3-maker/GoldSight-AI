name: TradeSight Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install frontend and Capacitor dependencies
        working-directory: frontend
        run: npm install

      - name: Build the web app
        working-directory: frontend
        env:
          # Static Android bundle must use the same API origin as the deployed website.
          VITE_API_BASE_URL: https://goldsight-ai-api.onrender.com
        run: npm run build

      - name: Generate Android project
        working-directory: frontend
        run: npx cap add android

      - name: Configure Firebase Android app
        working-directory: frontend
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
            echo "Missing FIREBASE_ANDROID_CONFIG_JSON repository secret."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json

      - name: Prepare TradeSight native icon and launch theme
        working-directory: frontend
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/prepare-android.py
          python scripts/configure-android-overlay.py

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Configure permanent Android signing
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ format('1.0.{0}', github.run_number) }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          test -s android/release-key.jks
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/release-key.jks" >> "$GITHUB_ENV"
          python scripts/configure-android-signing.py

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle distribution with retry
        working-directory: frontend/android
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.14.3"
          DIST_URL="https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-all.zip"
          DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-${GRADLE_VERSION}-all/manual"
          mkdir -p "$DIST_DIR"
          for attempt in 1 2 3 4 5; do
            echo "Downloading Gradle distribution (attempt $attempt/5)..."
            if curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 300 "$DIST_URL" -o "$DIST_DIR/gradle-${GRADLE_VERSION}-all.zip"; then
              unzip -q "$DIST_DIR/gradle-${GRADLE_VERSION}-all.zip" -d "$DIST_DIR"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Gradle distribution download failed after retries."
              exit 1
            fi
            sleep 10
          done
          echo "Gradle distribution download prepared."

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature and upgrade compatibility
        working-directory: frontend/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          EXPECTED_CERT="$(keytool -list -v -keystore release-key.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$EXPECTED_CERT" ] || [ -z "$ACTUAL_CERT" ] || [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
            echo "APK signing certificate does not match the permanent release keystore."
            exit 1
          fi
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          echo "Application ID: $APP_ID"
          echo "Version code: $VERSION_CODE"
          test "$APP_ID" = "com.tradesight.app"
          test "$VERSION_CODE" -gt 0

      - name: Upload TradeSight signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeSight-Android-release
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
