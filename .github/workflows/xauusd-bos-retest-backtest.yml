name: XAUUSD BOS Retest A-B Backtest

on:
  push:
    branches:
      - research/xauusd-bos-retest-backtest
    paths:
      - ".github/workflows/xauusd-bos-retest-backtest.yml"
      - "backend/app/backtest.py"
      - "backend/scripts/compare_xauusd_bos_retest.py"
      - "backend/tests/test_backtest_validation.py"

permissions:
  contents: read

jobs:
  replay:
    name: Read-only XAUUSD strategy comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for baseline strategy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backtest outcome accounting
        working-directory: backend
        run: pytest -q tests/test_backtest_validation.py

      - name: Run original versus retest replay (read-only database access)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/scripts/compare_xauusd_bos_retest.py

      - name: Upload detailed A-B report
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-bos-retest-comparison
          path: backtest-results/xauusd_bos_retest_comparison.json
          if-no-files-found: error
          retention-days: 14
