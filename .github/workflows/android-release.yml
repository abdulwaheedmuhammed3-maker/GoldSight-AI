name: TradeSight Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build web app
        working-directory: frontend
        run: npm run build

      - name: Generate Android project
        working-directory: frontend
        run: npx cap add android

      - name: Configure Firebase Android app
        working-directory: frontend
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
            echo "Missing FIREBASE_ANDROID_CONFIG_JSON repository secret."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json

      - name: Prepare TradeSight native assets
        working-directory: frontend
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/prepare-android.py

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Configure permanent Android signing
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          test -s android/release-key.jks
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/release-key.jks" >> "$GITHUB_ENV"
          python scripts/configure-android-signing.py

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        working-directory: frontend/android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found at $APKSIGNER"
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f -print
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"

          # Ensure every release is signed by the permanent upload key. This is
          # what allows Android to update an existing TradeSight installation.
          EXPECTED_CERT="$(keytool -list -v -keystore release-key.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$EXPECTED_CERT" ] || [ -z "$ACTUAL_CERT" ] || [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
            echo "APK signing certificate does not match the permanent release keystore."
            exit 1
          fi
          echo "Verified: APK uses the permanent TradeSight release certificate."

          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          echo "Application ID: $APP_ID"
          echo "Version code: $VERSION_CODE"
          test "$APP_ID" = "com.tradesight.app"
          test "$VERSION_CODE" -gt 0

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradesight-android-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TradeSight ${{ github.ref_name }}
          generate_release_notes: true
          files: frontend/android/app/build/outputs/apk/release/app-release.apk
