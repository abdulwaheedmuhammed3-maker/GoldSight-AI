name: TradeSight TP Progression Age-Window Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only TP metadata age-window audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database driver
        run: python -m pip install "psycopg[binary]>=3.2,<4.0"

      - name: Run read-only age-window audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not configured."
            exit 1
          fi
          python backend/scripts/audit_tp_progression_legacy_window.py
