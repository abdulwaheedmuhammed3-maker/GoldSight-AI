name: TradeSight Stored Outcome Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dry-run stored TP/SL history audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database driver
        run: python -m pip install "psycopg[binary]>=3.2,<4.0"

      - name: Run dry-run audit (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not configured."
            exit 1
          fi
          python backend/scripts/correct_stored_tp_sl_outcomes.py
