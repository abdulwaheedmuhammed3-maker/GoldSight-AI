services:
  - type: web
    name: goldsight-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: "*"
      - key: MARKET_DATA_PROVIDER
        value: oanda
      - key: OANDA_ENVIRONMENT
        value: practice
